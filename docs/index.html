<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stronghold Route</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root {
  --stone: #e8e5dc; --stone-deep: #d4cfc0; --ink: #241f16; --ink-soft: #4a4234; --ink-faint: #7a7161;
  --panel: #f4f1e8; --panel-border: #b8ae95; --slot: #ffffff; --slot-border: #a89d80;
  --amber: #b8720f; --amber-bright: #e8a33d; --active-ink: #1c1610;
  --shadow: rgba(36, 31, 22, 0.18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --stone: #171410; --stone-deep: #0f0d0a; --ink: #ece6d6; --ink-soft: #b8ae98; --ink-faint: #8a8168;
    --panel: #211d16; --panel-border: #4a4232; --slot: #2a251c; --slot-border: #5c5340;
    --amber: #e8a33d; --amber-bright: #ffc466; --active-ink: #1c1610;
    --shadow: rgba(0, 0, 0, 0.5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--stone); color: var(--ink);
  font-family: "Public Sans", system-ui, sans-serif; font-size: 15px;
  display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 100%;
}

/* ---------- sidebar ---------- */
.side {
  background: var(--panel); border-right: 3px solid var(--panel-border);
  display: flex; flex-direction: column; min-height: 0;
}
.brand { padding: 20px 18px 14px; border-bottom: 2px solid var(--panel-border); }
.brand a { color: inherit; text-decoration: none; }
.brand .name { font-family: "Silkscreen", monospace; font-size: 1.15rem; line-height: 1.2; display: block; }
.brand .tag { font-family: "Space Mono", monospace; font-size: 0.7rem; color: var(--ink-faint); letter-spacing: 0.06em; }
.overall { margin-top: 12px; }
.overall .track { height: 8px; background: var(--slot); border: 2px solid var(--slot-border); overflow: hidden; }
.overall .fill { height: 100%; width: 0; background: var(--amber); transition: width 0.3s ease; }
.overall .label { font-family: "Space Mono", monospace; font-size: 0.68rem; color: var(--ink-faint); margin-top: 4px; display: block; }

nav.sections { flex: 1; overflow-y: auto; padding: 8px 10px 16px; }
.group { margin-top: 14px; }
.group-title {
  font-family: "Silkscreen", monospace; font-size: 0.66rem; letter-spacing: 0.08em; color: var(--ink-faint);
  padding: 0 8px 6px; display: block;
}
nav.sections a {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin: 1px 0;
  color: var(--ink-soft); text-decoration: none; border: 2px solid transparent; font-weight: 500;
}
nav.sections a:hover { background: var(--slot); border-color: var(--slot-border); color: var(--ink); }
nav.sections a:focus-visible { outline: 3px solid var(--amber-bright); outline-offset: -1px; }
nav.sections a[aria-current="page"] { background: var(--amber); border-color: var(--amber); color: var(--active-ink); font-weight: 700; }
nav.sections a .icon { width: 1.3em; text-align: center; flex: 0 0 auto; }
nav.sections a .title { flex: 1; min-width: 0; }
nav.sections a .count {
  font-family: "Space Mono", monospace; font-size: 0.68rem; color: var(--ink-faint);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
nav.sections a[aria-current="page"] .count { color: var(--active-ink); opacity: 0.8; }
nav.sections a .count.done::before { content: "\2713 "; }
nav.sections a.external .count { font-size: 0.8rem; }
.side-foot { padding: 12px 18px 16px; border-top: 2px solid var(--panel-border); font-family: "Space Mono", monospace; font-size: 0.68rem; color: var(--ink-faint); }

/* ---------- main ---------- */
main { min-width: 0; min-height: 0; position: relative; }
iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--stone); }

/* ---------- phone: sidebar becomes a drawer ---------- */
.topbar { display: none; }
.scrim { display: none; }
@media (max-width: 820px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    background: var(--panel); border-bottom: 3px solid var(--panel-border);
  }
  .topbar button {
    font-family: "Space Mono", monospace; font-size: 0.8rem; font-weight: 700; padding: 8px 12px; cursor: pointer;
    background: var(--slot); color: var(--ink); border: 2px solid var(--slot-border);
  }
  .topbar .current { font-family: "Silkscreen", monospace; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); z-index: 20;
    transform: translateX(-102%); transition: transform 0.2s ease; box-shadow: 4px 0 0 var(--shadow);
  }
  body.drawer-open .side { transform: none; }
  body.drawer-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 10; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <button type="button" id="open-drawer" aria-controls="sidebar" aria-expanded="false">&#9776; Sections</button>
  <span class="current" id="current-title">Home</span>
</header>
<div class="scrim" id="scrim"></div>

<aside class="side" id="sidebar">
  <div class="brand">
    <a href="#home"><span class="name">Stronghold Route</span></a>
    <span class="tag">OUR WORLD 26.3 &middot; COBBLEMON 1.21.1 &middot; COBBLE VALLEY</span>
    <div class="overall" aria-label="Overall checklist progress">
      <div class="track"><div class="fill" id="overall-fill"></div></div>
      <span class="label" id="overall-label">Checklist progress</span>
    </div>
  </div>
  <nav class="sections" id="sections" aria-label="Guide sections"></nav>
  <div class="side-foot">Checkmarks save in this browser.</div>
</aside>

<main>
  <iframe id="view" title="Guide page" src="overview.html"></iframe>
</main>

<script>
(function () {
  // Sections: id is the address (#id), file is the page that opens in the main area.
  var GROUPS = [
    { title: "START", items: [
      { id: "home", file: "overview.html", icon: "\u{1F3E0}", title: "Home" },
      { id: "roadmap", file: "roadmap.html", icon: "\u{1F5FA}️", title: "The Full Route" },
      { id: "quickstart", file: "quickstart.html", icon: "⚡", title: "Quick Start" },
      { id: "join", file: "join.html", icon: "\u{1F44B}", title: "Join in 4 Steps" },
      { id: "online", file: "online.html", icon: "\u{1F310}", title: "Playing From Anywhere" }
    ]},
    { title: "COBBLE VALLEY", items: [
      { id: "cv-start", file: "cv-start.html", icon: "\u{1F331}", title: "Start Here" },
      { id: "cv-ages", file: "cv-ages.html", icon: "\u{1F3DB}\uFE0F", title: "Ages & Badges" },
      { id: "cv-skill", file: "cv-skill.html", icon: "\u{1F4C8}", title: "Skill & Quality" },
      { id: "cv-learning", file: "cv-learning.html", icon: "\u{1F393}", title: "Learning Recipes" },
      { id: "cv-quests", file: "cv-quests.html", icon: "\u{1F4DC}", title: "Quest Book" },
      { id: "cv-disciplines", file: "cv-disciplines.html", icon: "\u{1F528}", title: "Disciplines" },
      { id: "cv-books", file: "cv-books.html", icon: "\u{1F4E6}", title: "Books & Prize Crates" },
      { id: "cv-gear", file: "cv-gear.html", icon: "\u2694\uFE0F", title: "Gear by Age" },
      { id: "cv-bushcraft", file: "cv-bushcraft.html", icon: "\u{1F343}", title: "Bushcraft" },
      { id: "cv-lookup", file: "cv-lookup.html", icon: "\u{1F50E}", title: "Item Lookup" },
      { id: "cv-faq", file: "cv-faq.html", icon: "\u2753", title: "FAQ & Fixes" }
    ]},
    { title: "OUR MODS", items: [
      { id: "mods", file: "mods.html", icon: "\u{1F9F6}", title: "Cotton & Cookpots" },
      { id: "cobblemon", file: "cobblemon.html", icon: "⚪", title: "Pokémon Trail" },
      { id: "gyms", file: "gyms.html", icon: "\u{1F3C5}", title: "Trainers & Gyms" },
      { id: "twinportals", file: "twinportals.html", icon: "\u{1F535}", title: "Portal Device" },
      { id: "portalgun", file: "portalgun.html", icon: "\u{1F300}", title: "Rick's Portal Gun" },
      { id: "backpack", file: "backpack.html", icon: "\u{1F392}", title: "Traveler's Backpack" },
      { id: "decorate", file: "decorate.html", icon: "\u{1FAB4}", title: "Making It Home" },
      { id: "visuals", file: "visuals.html", icon: "\u{1F305}", title: "Light & Texture" },
      { id: "controls", file: "controls.html", icon: "⌨️", title: "Every Key" }
    ]},
    { title: "RIDE & LIVE", items: [
      { id: "ships", file: "ships.html", icon: "⛵", title: "Ships" },
      { id: "aircraft", file: "aircraft.html", icon: "✈️", title: "Planes & Airships" },
      { id: "wheels", file: "wheels.html", icon: "\u{1F6B2}", title: "Cars & Bikes" },
      { id: "villagers", file: "villagers.html", icon: "\u{1F48D}", title: "Villagers & Family" },
      { id: "breeding", file: "breeding.html", icon: "\u{1F95A}", title: "Pokémon Eggs" },
      { id: "gear", file: "gear.html", icon: "\u{1F6E1}️", title: "Armor, Weapons & Style" }
    ]},
    { title: "SURVIVAL", items: [
      { id: "mining", file: "mining.html", icon: "⛏️", title: "Mining" },
      { id: "caving", file: "caving.html", icon: "\u{1F573}️", title: "Caving" },
      { id: "iron", file: "iron.html", icon: "\u{1F529}", title: "Iron" },
      { id: "copper", file: "copper.html", icon: "\u{1F514}", title: "Copper" },
      { id: "enchanting", file: "enchanting.html", icon: "\u{1F4D6}", title: "Enchanting" },
      { id: "farms", file: "farms.html", icon: "\u{1F33E}", title: "Farms" },
      { id: "exploration", file: "exploration.html", icon: "\u{1F9ED}", title: "Exploration" }
    ]},
    { title: "SETUP", items: [
      { id: "repo", href: "https://github.com/av1017/minecraft-modpack", icon: "\u{1F4E6}", title: "Mods & sync (GitHub)", external: true }
    ]},
    { title: "DEV (COBBLE VALLEY AGES)", items: [
      { id: "dev-overview", file: "dev-overview.html", icon: "\u{1F6E0}\uFE0F", title: "Dev: Overview" },
      { id: "dev-architecture", file: "dev-architecture.html", icon: "\u{1F9E9}", title: "Dev: Architecture" },
      { id: "dev-data", file: "dev-data.html", icon: "\u{1F5C2}\uFE0F", title: "Dev: Data Files" },
      { id: "dev-howto", file: "dev-howto.html", icon: "\u{1F4DD}", title: "Dev: How-Tos" },
      { id: "dev-commands", file: "dev-commands.html", icon: "\u2328\uFE0F", title: "Dev: Commands" },
      { id: "dev-generators", file: "dev-generators.html", icon: "\u2699\uFE0F", title: "Dev: Generators" },
      { id: "dev-testing", file: "dev-testing.html", icon: "\u{1F9EA}", title: "Dev: Testing" },
      { id: "dev-releasing", file: "dev-releasing.html", icon: "\u{1F680}", title: "Dev: Releasing" },
      { id: "dev-troubleshooting", file: "dev-troubleshooting.html", icon: "\u{1FA7A}", title: "Dev: Troubleshooting" }
    ]}
  ];

  var nav = document.getElementById("sections");
  var view = document.getElementById("view");
  var byId = {}, byFile = {};
  GROUPS.forEach(function (g) {
    var wrap = document.createElement("div"); wrap.className = "group";
    var t = document.createElement("span"); t.className = "group-title"; t.textContent = g.title; wrap.appendChild(t);
    g.items.forEach(function (it) {
      var a = document.createElement("a");
      a.innerHTML = '<span class="icon" aria-hidden="true"></span><span class="title"></span><span class="count"></span>';
      a.querySelector(".icon").textContent = it.icon;
      a.querySelector(".title").textContent = it.title;
      if (it.external) {
        a.href = it.href; a.target = "_blank"; a.rel = "noopener"; a.className = "external";
        a.querySelector(".count").textContent = "↗";
      } else {
        a.href = "#" + it.id; a.dataset.id = it.id;
        byId[it.id] = it; byFile[it.file] = it; it.link = a;
      }
      wrap.appendChild(a);
    });
    nav.appendChild(wrap);
  });

  // ---------- routing ----------
  function current() { var h = (location.hash || "").replace(/^#/, "").split("/")[0]; return byId[h] ? h : "home"; }
  function show(id) {
    var it = byId[id];
    var want = new URL(it.file, location.href).href;
    if (view.contentWindow && view.contentWindow.location.href.split("#")[0] !== want) view.src = it.file;
    Object.keys(byId).forEach(function (k) {
      if (k === id) byId[k].link.setAttribute("aria-current", "page"); else byId[k].link.removeAttribute("aria-current");
    });
    document.getElementById("current-title").textContent = it.title;
    document.title = (id === "home" ? "" : it.title + " · ") + "Stronghold Route";
    closeDrawer();
  }
  window.addEventListener("hashchange", function () { show(current()); });

  // Pages open inside the main area: hide their own "back" links, and keep links between pages in this layout.
  view.addEventListener("load", function () {
    var doc;
    try { doc = view.contentDocument; } catch (e) { return; }
    if (!doc) return;
    var st = doc.createElement("style");
    st.textContent = ".crumb { display: none !important; }";
    doc.head.appendChild(st);
    doc.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a[href]");
      if (!a) return;
      var raw = a.getAttribute("href");
      if (raw.charAt(0) === "#") return;                      // jump within the page
      var url = new URL(a.href);
      if (url.origin !== location.origin) { a.target = "_blank"; a.rel = "noopener"; return; }
      var file = url.pathname.split("/").pop() || "index.html";
      if (file === "index.html") { e.preventDefault(); location.hash = "home"; return; }
      if (byFile[file]) { e.preventDefault(); location.hash = byFile[file].id; }
    });
    // Keep the sidebar in step if the page changed by some other route.
    var file = (view.contentWindow.location.pathname.split("/").pop());
    if (byFile[file] && byFile[file].id !== current()) history.replaceState(null, "", "#" + byFile[file].id);
    refreshProgress();
  });

  // ---------- checklist progress ----------
  // Each page saves its checkmarks in localStorage under mc-guide-<page>-progress-fallback.
  // Totals come from counting the page's checklist items, so they stay right when pages change.
  var totals = {};
  function keyFor(it) { return "mc-guide-" + it.file.replace(".html", "") + "-progress-fallback"; }
  function checked(it, ids) {
    var state = {};
    try { state = JSON.parse(localStorage.getItem(keyFor(it)) || "{}"); } catch (e) {}
    var n = 0; ids.forEach(function (id) { if (state[id]) n++; }); return n;
  }
  function refreshProgress() {
    var all = 0, done = 0;
    Object.keys(totals).forEach(function (id) {
      var it = byId[id], ids = totals[id];
      var n = checked(it, ids);
      var c = it.link.querySelector(".count");
      c.textContent = n + "/" + ids.length;
      c.classList.toggle("done", ids.length > 0 && n === ids.length);
      all += ids.length; done += n;
    });
    var pct = all ? Math.round(done / all * 100) : 0;
    document.getElementById("overall-fill").style.width = pct + "%";
    document.getElementById("overall-label").textContent = done + " of " + all + " checklist items (" + pct + "%)";
  }
  Object.keys(byId).forEach(function (id) {
    fetch(byId[id].file).then(function (r) { return r.text(); }).then(function (html) {
      var ids = [], re = /<li data-id="([^"]+)"/g, m;
      while ((m = re.exec(html))) ids.push(m[1]);
      if (ids.length) { totals[id] = ids; refreshProgress(); }
    }).catch(function () {});
  });
  window.addEventListener("storage", refreshProgress);   // fires when a page in the main area saves a checkmark

  // ---------- phone drawer ----------
  var openBtn = document.getElementById("open-drawer");
  function closeDrawer() { document.body.classList.remove("drawer-open"); openBtn.setAttribute("aria-expanded", "false"); }
  openBtn.addEventListener("click", function () {
    var open = !document.body.classList.contains("drawer-open");
    document.body.classList.toggle("drawer-open", open); openBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.getElementById("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });

  show(current());
})();
</script>
</body>
</html>
